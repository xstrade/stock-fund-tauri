[package]
name = "stock-fund-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-http = "=2.9.0"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-updater = "=2.14.1"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false }

[profile.release]
strip = true
lto = "thin"
